<noscript><p style="padding:30px">This interactive concept needs JavaScript. It makes no external requests and uses only sample content.</p></noscript>
<script>
'use strict';
// Standalone interaction prototype: no server, storage, tracking, microphone, or clinical evaluation.
// The eventual React/Node application is a separate implementation, not represented as complete here.
const ICONS={grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',play:'<path d="m8 5 11 7-11 7V5Z"/>',cards:'<rect x="7" y="5" width="13" height="16" rx="2"/><path d="M5 17H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h11v1"/><path d="M11 10h5m-5 4h5"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/>',arrow:'<path d="M4 12h15m-6-6 6 6-6 6"/>',plus:'<path d="M12 4v16M4 12h16"/>',check:'<path d="m5 12 4 4L19 6"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 7a7 7 0 0 1 11.5-2l2.9 3M4 16l2.9 3A7 7 0 0 0 18.4 17"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',flag:'<path d="M5 21V3m0 1c5-4 9 4 14 0v9c-5 4-9-4-14 0"/>',swap:'<path d="M3 7h17m-4-4 4 4-4 4M21 17H4m4-4-4 4 4 4"/>',shield:'<path d="M12 3 4 6v5c0 5 8 10 8 10s8-5 8-10V6l-8-3Z"/><path d="m8 11 3 3 5-5"/>',spark:'<path d="m12 1 2.5 8.5L23 12l-8.5 2.5L12 23l-2.5-8.5L1 12l8.5-2.5L12 1Z"/>'};
const icon=(name)=>`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.grid}</svg>`;
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GOALS=[{id:'sounds',label:'Speech sounds'},{id:'describe',label:'Describing'},{id:'sentences',label:'Sentence building'}];
const AVATARS=[{id:'fox',emoji:'🦊',label:'Fox',color:''},{id:'frog',emoji:'🐸',label:'Frog',color:'mint'},{id:'rabbit',emoji:'🐰',label:'Rabbit',color:'lav'},{id:'panda',emoji:'🐼',label:'Panda',color:'yellow'},{id:'cat',emoji:'🐱',label:'Cat',color:'yellow'},{id:'bear',emoji:'🐻',label:'Bear',color:''},{id:'robot',emoji:'🤖',label:'Robot',color:'lav'},{id:'owl',emoji:'🦉',label:'Owl',color:'mint'}];
const seedCards=[
{id:'c1',goal:'sounds',emoji:'☀️',title:'A little sunshine',prompt:'Name what you see. Try it in a short phrase.',cue:'Sun. A bright sun.',question:'Which word names this picture?',choices:['Sun','Cup','Bicycle'],correct:0},
{id:'c2',goal:'describe',emoji:'🚲',title:'Tell me about it',prompt:'Name two things you notice about a bicycle.',cue:'It has wheels. You can ride it.',question:'Which one can you ride?',choices:['A spoon','A bicycle','A cloud'],correct:1},
{id:'c3',goal:'sentences',emoji:'☂️',title:'Finish the thought',prompt:'Finish this sentence: I take an umbrella when…',cue:'…it is raining.',question:'I take an umbrella when…',choices:['I am asleep.','it is raining.','I brush my teeth.'],correct:1},
{id:'c4',goal:'sounds',emoji:'🪁',title:'Up in the air',prompt:'Name the picture. Then use the word in a phrase.',cue:'Kite. A kite in the sky.',question:'What is in this picture?',choices:['A book','A kite','A shoe'],correct:1},
{id:'c5',goal:'describe',emoji:'🍋',title:'A closer look',prompt:'What colour is it? What might it taste like?',cue:'A lemon can be yellow and sour.',question:'Which word describes this lemon’s colour?',choices:['Blue','Purple','Yellow'],correct:2},
{id:'c6',goal:'sentences',emoji:'📖',title:'Make a sentence',prompt:'Use the words “book” and “read” in a sentence.',cue:'I like to read a book.',question:'Choose a sentence about the picture.',choices:['I read a book.','I ride a cloud.','I drink a shoe.'],correct:0},
{id:'c7',goal:'sounds',emoji:'🐟',title:'Under the water',prompt:'Name the picture and use the word in a phrase.',cue:'Fish. A fish in the water.',question:'Which word names this picture?',choices:['Fish','Hat','Tree'],correct:0},
{id:'c8',goal:'describe',emoji:'🌳',title:'Look and describe',prompt:'Name two things you can see on a tree.',cue:'Leaves and branches.',question:'Which part belongs to a tree?',choices:['Wheels','Leaves','Shoelaces'],correct:1},
{id:'c9',goal:'sentences',emoji:'🥤',title:'Join the ideas',prompt:'Finish: I get a drink because…',cue:'…I am thirsty.',question:'I get a drink because…',choices:['I am thirsty.','the book is blue.','a car has wheels.'],correct:0},
{id:'c10',goal:'sounds',emoji:'🌙',title:'In the night sky',prompt:'Name the picture and make a short phrase.',cue:'Moon. The moon is bright.',question:'What is in this picture?',choices:['Moon','Bicycle','Cup'],correct:0},
{id:'c11',goal:'describe',emoji:'🎒',title:'What is it for?',prompt:'Describe what you might put inside a backpack.',cue:'Books, a snack, or a pencil case.',question:'What might go in a backpack?',choices:['A whole tree','A bus','A book'],correct:2},
{id:'c12',goal:'sentences',emoji:'🌼',title:'Tell a small story',prompt:'Make a sentence using “flower” and “garden”.',cue:'A flower grows in the garden.',question:'Choose a sentence about the picture.',choices:['The flower grows.','The chair drinks.','The road reads.'],correct:0}
];
function makeInitial(){return {view:'setup',theme:'younger',mode:'flash',players:[{id:'p1',name:'Player 1',avatar:'fox',goals:['sounds','describe']},{id:'p2',name:'Player 2',avatar:'frog',goals:['describe','sentences']}],decks:[{id:'everyday',name:'Everyday discoveries',description:'Ordinary objects, simple prompts and room for your own content.',kind:'Sample deck',cards:structuredClone(seedCards)},{id:'outdoors',name:'Out & about',description:'A smaller sample card pool for everyday adventures.',kind:'Sample deck',cards:structuredClone(seedCards.filter(c=>['c1','c2','c3','c4','c8','c12'].includes(c.id)))}],deckId:'everyday',turns:3,started:false,finished:false,current:0,per:{},history:[],revealed:false,answer:null,deckCounter:0,cardCounter:0};}
let state=makeInitial();let toastTimer;let lastFocus=null;
const root=document.getElementById('root');const dialog=document.getElementById('dialog');
const avatarOf=(id)=>AVATARS.find(a=>a.id===id)||AVATARS[0];
function avatarHtml(p,cls=''){const a=avatarOf(p.avatar);return `<span class="avatar ${a.color} ${cls}" aria-hidden="true">${a.emoji}</span>`;}
const goalName=id=>GOALS.find(g=>g.id===id)?.label||'Custom goal';
const deck=()=>state.decks.find(d=>d.id===state.deckId);
const player=()=>state.players[state.current]||state.players[0];
const playerStats=p=>state.per[p.id]||{completed:0,cursor:0};
function currentCard(){const p=player();const all=deck()?.cards||[];const groups=p.goals.map(g=>all.filter(c=>c.goal===g&&(state.mode==='flash'||c.choices?.length===3))).filter(g=>g.length);if(!groups.length)return null;const n=playerStats(p).cursor;const g=groups[n%groups.length];return g[Math.floor(n/groups.length)%g.length];}
function missingGoals(){return state.players.flatMap(p=>p.goals.filter(g=>!deck()?.cards.some(c=>c.goal===g&&(state.mode==='flash'||c.choices?.length===3))).map(g=>`${p.name}: ${goalName(g)}`));}
function toast(msg){document.getElementById('toast').textContent=msg;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',4500);}
const pressed=b=>`aria-pressed="${b?'true':'false'}"`;
const locked=()=>state.started&&!state.finished;
function clearFinished(){if(state.finished){state.started=false;state.finished=false;state.per={};state.history=[];state.current=0;state.revealed=false;state.answer=null;}}
function navButton(id,label,ico){return `<button data-action="nav" data-view="${id}" ${state.view===id?'aria-current="page"':''}>${icon(ico)}<span>${label}</span></button>`;}
function render(){const active=document.activeElement;let focusSelector=null;if(active&&root.contains(active)){if(active.id)focusSelector='#'+CSS.escape(active.id);else if(active.dataset.action){focusSelector='[data-action="'+CSS.escape(active.dataset.action)+'"]';for(const key of ['player','goal','count','mode','theme','view','deck','answer'])if(active.dataset[key])focusSelector+='[data-'+key+'="'+CSS.escape(active.dataset[key])+'"]';}}document.body.classList.toggle('older',state.theme==='older');const names={setup:'Session setup',play:state.finished?'Session recap':'Play room',decks:'Deck studio',notes:'Preview notes'};
root.innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-symbol">${icon('spark')}</div><div><strong>Session Studio</strong><small>INTERACTIVE CONCEPT</small></div></div><div class="nav-label">YOUR WORKSPACE</div><nav class="nav" aria-label="Main navigation">${navButton('setup','Session setup','grid')}${navButton('play','Play room','play')}${navButton('decks','Deck studio','cards')}${navButton('notes','Preview notes','info')}</nav><div class="sidebar-bottom"><div class="note-card"><strong>A small look at the idea.</strong><p>Illustrative content. No accounts, real student data or clinical assessment.</p></div><div class="author">Prepared by Patrick<strong>Forson &amp; Co.</strong></div></div></aside><div class="main"><div class="concept-notice" role="note">Interactive concept — fictional demonstration data</div><header class="topbar"><div class="breadcrumb">Workspace <span aria-hidden="true">/</span> <b>${names[state.view]}</b></div><div class="topright"><span class="tag dot">Sample content only</span><button class="text-btn" data-action="tour">How to try it</button><button class="button small" data-action="reset">${icon('refresh')}Reset demo</button></div></header><main class="workspace" id="main-content" tabindex="-1">${state.view==='setup'?setupView():state.view==='play'?playView():state.view==='decks'?decksView():notesView()}<footer class="footer-note"><span><b>Interface concept, not a clinical product.</b> Use fictional content only. Changes disappear on reload.</span><span>Keep project discussions and payments on Upwork.</span></footer></main></div></div>`;
if(focusSelector){const next=root.querySelector(focusSelector);if(next&&!next.disabled)next.focus({preventScroll:true});}}
function setupView(){const lock=locked();return `<div class="page-heading"><div><div class="eyebrow">A calmer way to take turns</div><h1>One session.<br>Every player’s goals.</h1><p>Choose your players, bring their goals together, and explore a shared activity without losing anyone’s place.</p><button class="button primary small" style="margin-top:14px" data-action="start" ${missingGoals().length?'disabled':''}>Try the sample session ${icon('arrow')}</button></div><div class="heading-actions"><span class="tag outline">1–4 players</span><span class="tag outline">One shared device</span></div></div><div class="setup-layout"><div class="left-stack"><section class="panel"><div class="panel-title"><div class="num-label"><span class="num">01</span>Who’s playing?</div><div class="count-control" role="group" aria-label="Number of players">${[1,2,3,4].map(n=>`<button data-action="count" data-count="${n}" ${pressed(state.players.length===n)} ${lock?'disabled':''} aria-label="${n} player${n>1?'s':''}">${n}</button>`).join('')}</div></div>${lock?'<div class="lock-note">A demo session is in progress. Avatars can change; reset the demo before changing its roster or goals.</div>':''}<div class="player-list">${state.players.map(p=>`<article class="player"><div class="player-top"><button class="avatar-button" data-action="avatar" data-player="${p.id}" aria-label="Change ${p.name} avatar">${avatarHtml(p)}</button><div><div class="player-name">${p.name}</div><div class="player-sub">${p.goals.length} selected goal${p.goals.length>1?'s':''}</div></div><span class="player-status">Tap avatar to swap</span></div><div class="chips" role="group" aria-label="Goals for ${p.name}">${GOALS.map(g=>`<button class="chip" data-action="goal" data-player="${p.id}" data-goal="${g.id}" ${pressed(p.goals.includes(g.id))} ${lock?'disabled':''}>${p.goals.includes(g.id)?icon('check'):icon('plus')}${g.label}</button>`).join('')}</div></article>`).join('')}</div><p class="helper">Goals stay with the player—not their avatar. Each player needs at least one goal. Goal labels and prompts are illustrative.</p></section><section class="panel"><div class="panel-title"><div class="num-label"><span class="num">02</span>Choose the visual style</div></div><div class="style-options"><button class="style-option" data-action="theme" data-theme="younger" ${pressed(state.theme==='younger')}><span class="style-icon" aria-hidden="true">✿</span><span><strong>Playful explorers</strong><small>Younger audience direction</small></span><span class="style-check" aria-hidden="true"></span></button><button class="style-option" data-action="theme" data-theme="older" ${pressed(state.theme==='older')}><span class="style-icon" style="background:#e4e8f3" aria-hidden="true">✦</span><span><strong>Focus club</strong><small>Older audience direction</small></span><span class="style-check" aria-hidden="true"></span></button></div><p class="helper">Two visual directions, the same session logic. Actual age bands need your input.</p></section></div><aside class="panel preview-panel"><div class="preview-head"><div class="eyebrow">03 &nbsp; A peek at the activity</div><h2>Small prompts.<br>Shared moments.</h2><span class="spark">${icon('spark')}</span></div><div class="mini-card"><div class="mini-player">${avatarHtml(state.players[0])}<span>${state.players[0].name}’s turn</span><span class="tag" style="margin-left:auto">Sample</span></div><div class="mini-art"><div class="orb" aria-hidden="true">☀️</div></div><h3>A little sunshine</h3><p>Name what you see. Try it in a phrase.</p><div class="sample-label">ILLUSTRATIVE CARD</div></div><div class="preview-body"><div class="field"><label class="field-label" for="deck-select">Choose a deck</label><select class="select" id="deck-select" ${lock?'disabled':''}>${state.decks.map(d=>`<option value="${d.id}" ${state.deckId===d.id?'selected':''}>${esc(d.name)} · ${d.cards.length} cards</option>`).join('')}</select></div><div class="field"><span class="field-label" id="mode-label">Card format</span><div class="segmented" role="group" aria-labelledby="mode-label"><button data-action="mode" data-mode="flash" ${pressed(state.mode==='flash')}>Flashcards</button><button data-action="mode" data-mode="choice" ${pressed(state.mode==='choice')}>Multiple choice</button></div></div><div class="field"><label class="field-label" for="turn-select">Turns per player</label><select class="select" id="turn-select" ${lock?'disabled':''}>${[3,5,8].map(n=>`<option value="${n}" ${state.turns===n?'selected':''}>${n} turns · ${n*state.players.length} total</option>`).join('')}</select></div>${missingGoals().length?`<p class="helper" style="color:var(--danger);margin-bottom:12px">Some selected goals have no cards in this format. Change the deck, goals or format before starting.</p>`:''}<button class="button primary" data-action="start" ${missingGoals().length?'disabled':''}>${icon('play')}${lock?'Resume demo session':'Start demo session'}</button><div class="meta-row"><span>${state.players.length} players · ${state.turns*state.players.length} turns</span><span>No login needed</span></div></div></aside></div>`;}
function playView(){if(!state.started)return `<div class="empty panel"><span class="tag">Let’s set the scene</span><h2>Your play room is ready.</h2><p>Choose one to four sample players and their goals, then start a demo session.</p><button class="button primary" data-action="nav" data-view="setup">Set up a session ${icon('arrow')}</button></div>`;if(state.finished)return summaryView();const p=player(),c=currentCard();const total=state.players.length*state.turns,n=state.history.length;let cue='';if(c){if(state.mode==='flash'){cue=state.revealed?`<div class="cue"><span class="field-label">SAMPLE FACILITATOR CUE</span>${esc(c.cue)}</div>`:`<button class="button" data-action="reveal">${icon('eye')}Reveal sample cue</button>`;}else{cue=`<div class="choices" role="group" aria-label="Answer options">${c.choices.map((v,i)=>`<button class="choice ${state.answer===i?(i===c.correct?'selected':'wrong'):''}" data-action="answer" data-answer="${i}" ${pressed(state.answer===i)}>${esc(v)}</button>`).join('')}</div><p class="feedback" role="status">${state.answer===null?'Choose an option to try the interaction.':state.answer===c.correct?'That matches this sample card. Continue when ready.':'Not this one in the sample. Try another option.'}</p>`;}}
return `<div class="page-heading"><div><div class="eyebrow">Play room / ${state.theme==='younger'?'Playful explorers':'Focus club'}</div><h1>${p.name}, your turn.</h1><p>A shared activity. A separate card pool for each player’s goals.</p></div><div class="heading-actions"><button class="button small" data-action="end">${icon('flag')}End session</button></div></div><div class="players-strip ${state.players.length===1?'one':''}" style="--players:${state.players.length}">${state.players.map((x,i)=>`<div class="player-tab ${i===state.current?'active':''}"><button class="avatar-button" data-action="avatar" data-player="${x.id}" aria-label="Change ${x.name} avatar">${avatarHtml(x)}</button><div><strong>${x.name}</strong><small>${playerStats(x).completed}/${state.turns} turns · ${x.goals.length} goals</small></div>${i===state.current?'<span class="turn-dot" aria-label="Current player"></span>':''}</div>`).join('')}</div><div class="layout-game"><section><div class="game-card">${c?`<div class="game-card-top"><span class="tag">${esc(goalName(c.goal))}</span><span class="tag outline">${state.mode==='flash'?'Flashcard':'Multiple choice'}</span></div><div class="card-art" aria-hidden="true">${esc(c.emoji||'✦')}</div><h2>${esc(c.title)}</h2><p class="question">${esc(state.mode==='flash'?c.prompt:c.question)}</p>${cue}`:`<div class="empty"><h2>No matching cards yet</h2><p>This player needs cards for the selected goals and format. Return to setup or reset the demo.</p></div>`}</div><div class="game-controls"><button class="button" data-action="skip" ${!c?'disabled':''}>Skip card</button><div class="right"><button class="button primary" data-action="complete" ${!c||(state.mode==='flash'?!state.revealed:state.answer!==c.correct)?'disabled':''}>Complete turn ${icon('arrow')}</button></div></div><p class="helper">A completed turn records this demo interaction only. It is not a clinical score or assessment.</p></section><aside class="session-aside"><section class="panel"><div class="side-heading"><h3>Turn trail</h3><span class="tag outline">Shared session</span></div><div class="tiny-stat"><strong>${n}</strong> / ${total} turns completed</div><div class="trail">${Array.from({length:Math.min(total,12)},(_,i)=>`<div class="trail-dot ${i<n?'done':i===n?'current':''}">${i<n?'✓':i+1}</div>`).join('')}</div>${total>12?'<p class="helper">First 12 turns shown; the bar tracks the whole session.</p>':''}<div class="progress-line" role="progressbar" aria-label="Completed demo turns" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${n}"><div style="width:${100*n/total}%"></div></div></section><section class="panel"><h3>${p.name}’s goals</h3><div class="goal-row">${p.goals.map(g=>`<span class="goal-pill">${goalName(g)}</span>`).join('')}</div><div class="switch-row"><span>Avatar</span><button class="button small" data-action="avatar" data-player="${p.id}">${icon('swap')}Swap</button></div><div class="switch-row"><span>Style</span><button class="text-btn" data-action="theme" data-theme="${state.theme==='younger'?'older':'younger'}">${state.theme==='younger'?'Try older style':'Try younger style'}</button></div><div class="switch-row"><span>Card format</span><button class="text-btn" data-action="mode" data-mode="${state.mode==='flash'?'choice':'flash'}">${state.mode==='flash'?'Try choices':'Try flashcards'}</button></div></section><div class="state-proof">${icon('shield')}<strong style="display:block;margin:8px 0 4px">Their goals stay with them.</strong>Swap an avatar or visual style. The player’s identity, goals and completed turns stay intact.</div></aside></div>`;}
function summaryView(){return `<div class="page-heading"><div><div class="eyebrow">Session recap / demonstration only</div><h1>A turn for everyone.</h1><p>Here is what happened in this sample session. These are interaction counts—not clinical outcomes.</p></div><div class="heading-actions"><button class="button primary" data-action="restart">Try another session ${icon('arrow')}</button></div></div><div class="summary-banner"><div class="big-num">${state.history.length}</div><div><h3>Demo turns completed</h3><p>${state.players.length} sample players · ${esc(deck()?.name)} · no data saved to a server</p></div></div><div class="summary-grid">${state.players.map(p=>`<div class="summary-box">${avatarHtml(p)}<div><strong>${p.name}</strong><p>${playerStats(p).completed} turns completed · ${p.goals.map(goalName).join(', ')}</p></div></div>`).join('')}</div><section class="panel" style="margin-top:23px"><div class="panel-title"><h2>Session activity</h2><span class="tag">This tab only</span></div><div class="table-wrap"><table class="activity-table"><thead><tr><th>Turn</th><th>Player</th><th>Selected goal</th><th>Prompt</th></tr></thead><tbody>${state.history.map((h,i)=>`<tr><td>${i+1}</td><td>${esc(h.playerName)}</td><td>${esc(goalName(h.goal))}</td><td>${esc(h.title)}</td></tr>`).join('')||'<tr><td colspan="4">No turns were completed.</td></tr>'}</tbody></table></div></section>`;}
function decksView(){return `<div class="page-heading"><div><div class="eyebrow">Deck studio / content you control</div><h1>Make the cards your own.</h1><p>Explore the sample decks or create a small deck with fictional content. Custom cards can support flashcards and multiple choice.</p></div><div class="heading-actions"><button class="button primary" data-action="new-deck">${icon('plus')}New demo deck</button></div></div><div class="decks-grid">${state.decks.map(d=>`<article class="deck-card"><div class="deck-visual" aria-hidden="true">${(d.cards.length?d.cards.slice(0,3).map(c=>c.emoji||'✦'):['✦','＋']).map(e=>`<span class="paper-card">${esc(e)}</span>`).join('')}</div><div class="deck-body"><span class="tag ${d.id===state.deckId?'':'outline'}">${d.id===state.deckId?'Selected deck':esc(d.kind)}</span><h3>${esc(d.name)}</h3><p>${esc(d.description)}</p><div class="meta-row"><span>${d.cards.length} card${d.cards.length!==1?'s':''}</span><span>${new Set(d.cards.map(c=>c.goal)).size} goals</span></div><div class="deck-actions"><button class="button small" data-action="view-deck" data-deck="${d.id}">View cards</button><button class="button small" data-action="add-card" data-deck="${d.id}" ${locked()&&d.id===state.deckId?'disabled':''}>${icon('plus')}Add card</button><button class="button small primary" data-action="use-deck" data-deck="${d.id}" ${locked()||!d.cards.length?'disabled':''}>Use deck</button></div></div></article>`).join('')}</div><div class="panel library-bottom"><div class="num-label">${icon('shield')}A content boundary, not a clinical library.</div><p class="helper">All example prompts are invented to show interface behaviour. A qualified client content owner must supply or approve actual clinical material. Nothing you enter here is uploaded, saved permanently or shared. Do not enter real student names, case notes or identifiable information.</p>${locked()?'<p class="helper"><b>A session is running.</b> Finish or reset it before changing the selected deck. You can still create a separate demo deck.</p>':''}</div>`;}
function notesView(){return `<div class="page-heading"><div><div class="eyebrow">What this preview does—and doesn’t do</div><h1>Try the idea.<br>Define the real build.</h1><p>An original interface and interaction concept prepared for discussion. “Session Studio” is a working label, not the client’s approved brand.</p></div><div class="heading-actions"><button class="button primary" data-action="nav" data-view="setup">Try the session ${icon('arrow')}</button></div></div><div class="notes-grid"><section class="panel"><span class="notes-label">WORKING IN THIS DEMO</span><h2>The central session flow</h2><ul><li>One to four local sample players.</li><li>Multiple selected goals per player.</li><li>Two visual styles; age cut-offs not assumed.</li><li>Avatar switching without losing player state.</li><li>Turn-taking, per-player card pools and a session recap.</li><li>Sample flashcards and multiple-choice interactions.</li><li>In-memory custom decks and card entry.</li></ul></section><section class="panel"><span class="notes-label">NOT IMPLEMENTED</span><h2>Not a completed application</h2><ul><li>No React/Node backend, API or database.</li><li>No sign-in, permissions or persistent saved decks.</li><li>No subscriptions, uploads or billing.</li><li>No remote multiplayer or speech recognition.</li><li>No student records, clinical scores or reporting.</li><li>No security, clinical or regulatory certification.</li></ul></section><section class="panel"><span class="notes-label">REAL BUILD SCOPE</span><h2>Define the intended release.</h2><p>A real application needs agreed game formats, age groups, deck/content responsibilities, account needs, data boundaries and acceptance checks. This visual preview demonstrates one shared-device card-turn activity.</p></section><section class="panel"><span class="notes-label">PRIVACY & SHARING</span><h2>Fictional content only.</h2><p>The file runs in your browser without external dependencies, telemetry, network calls or local storage. Edits live in memory and disappear when the page is reloaded.</p><p>If hosted, the hosting provider may receive normal access logs. Noindex is not access control. Keep all pre-contract project discussions on Upwork.</p></section><section class="panel wide"><span class="notes-label">CONTENT & DELIVERY</span><h2>Your expertise shapes the clinical content.</h2><p>Example words, goal labels and prompts only demonstrate interface mechanics. They are not recommendations, a treatment plan or validated material for clinical use. A real release needs client-approved content, agreed handling of sensitive information, and testing against the agreed requirements.</p><p>Prepared by Patrick / Forson &amp; Co. using an AI-assisted workflow. This is original demonstration work, not paid client work or a completed React/Node application.</p></section></div>`;}
function openModal(title,html){lastFocus=document.activeElement;dialog.innerHTML=`<div class="dialog-title"><h2 id="dialog-heading">${esc(title)}</h2><button data-action="close" aria-label="Close dialog">×</button></div>${html}`;dialog.showModal();}
function closeModal(){dialog.close();if(lastFocus?.isConnected)lastFocus.focus();}
function avatarModal(id){const p=state.players.find(x=>x.id===id);if(!p)return;openModal(`Choose ${p.name}’s avatar`,`<p class="modal-copy">Only the picture changes. ${p.name} keeps their goals and completed turns.</p><div class="avatar-picker">${AVATARS.map(a=>`<button class="avatar-option" data-action="set-avatar" data-player="${p.id}" data-avatar="${a.id}" ${pressed(p.avatar===a.id)}><span aria-hidden="true">${a.emoji}</span>${a.label}</button>`).join('')}</div>`);}
function formModal(kind,id){if(kind==='deck'){openModal('Create a demo deck',`<p class="modal-copy">Use fictional content only. This deck exists in this browser tab until you reload.</p><form id="new-deck-form"><div class="form-field"><label for="deck-name">Deck name</label><input id="deck-name" name="name" required maxlength="50" placeholder="For example: Everyday conversations" autocomplete="off"></div><div class="modal-actions"><button type="button" class="button" data-action="close">Cancel</button><button class="button primary" type="submit">Create deck</button></div></form>`);return;}const d=state.decks.find(x=>x.id===id);if(!d||locked()&&id===state.deckId)return;openModal('Add a sample card',`<p class="modal-copy">Adding to <strong>${esc(d.name)}</strong>. No real names or clinical records.</p><form id="add-card-form" data-deck="${d.id}"><div class="form-field"><label for="card-title">Card title</label><input id="card-title" name="title" maxlength="50" required placeholder="A small conversation" autocomplete="off"></div><div class="form-field"><label for="card-goal">Illustrative goal</label><select id="card-goal" name="goal">${GOALS.map(g=>`<option value="${g.id}">${g.label}</option>`).join('')}</select></div><div class="form-field"><label for="card-prompt">Prompt / question</label><textarea id="card-prompt" name="prompt" maxlength="180" required placeholder="Describe something you take to a picnic."></textarea></div><div class="form-field"><label for="card-cue">Sample facilitator cue</label><input id="card-cue" name="cue" maxlength="180" required placeholder="A sandwich, a drink or a blanket." autocomplete="off"></div><div class="form-field"><label for="card-kind">Available formats</label><select id="card-kind" name="kind"><option value="both">Flashcard + multiple choice</option><option value="flash">Flashcard only</option></select></div><div id="choice-fields"><p class="helper">For a multiple-choice card, enter three different sample answers.</p>${['A','B','C'].map((l,i)=>`<div class="form-field"><label for="choice-${i}">Option ${l}</label><input id="choice-${i}" name="choice${i}" maxlength="70" required autocomplete="off"></div>`).join('')}<div class="form-field"><label for="correct-choice">Matching option in this sample</label><select id="correct-choice" name="correct"><option value="0">A</option><option value="1">B</option><option value="2">C</option></select></div></div><p id="form-error" role="alert" class="helper" style="color:var(--danger)"></p><div class="modal-actions"><button type="button" class="button" data-action="close">Cancel</button><button type="submit" class="button primary">Add card</button></div></form>`);}
function startSession(){if(missingGoals().length){toast('Every selected goal needs at least one card in this format.');return;}if(!locked()){state.started=true;state.finished=false;state.current=0;state.history=[];state.per=Object.fromEntries(state.players.map(p=>[p.id,{completed:0,cursor:0}]));state.revealed=false;state.answer=null;}state.view='play';render();document.getElementById('main-content').focus();window.scrollTo(0,0);}
function completeTurn(){const p=player(),c=currentCard();if(!locked()||!c||state.mode==='flash'&&!state.revealed||state.mode==='choice'&&state.answer!==c.correct)return;const s=state.per[p.id];state.history.push({playerId:p.id,playerName:p.name,goal:c.goal,title:c.title,cardId:c.id,mode:state.mode});s.completed++;s.cursor++;if(state.history.length>=state.turns*state.players.length){state.finished=true;}else{for(let i=1;i<=state.players.length;i++){const idx=(state.current+i)%state.players.length;if(state.per[state.players[idx].id].completed<state.turns){state.current=idx;break;}}}state.revealed=false;state.answer=null;render();document.getElementById('main-content').focus();}
function onAction(e){const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const d=b.dataset;switch(d.action){case'nav':state.view=d.view;render();document.getElementById('main-content').focus();window.scrollTo(0,0);break;case'count':if(locked())break;clearFinished();{const n=Number(d.count);for(let i=state.players.length;i<n;i++)state.players.push({id:`p${i+1}`,name:`Player ${i+1}`,avatar:AVATARS[i].id,goals:[GOALS[i%GOALS.length].id]});state.players=state.players.slice(0,n);render();}break;case'goal':if(locked())break;clearFinished();{const p=state.players.find(p=>p.id===d.player);if(!p)return;if(p.goals.includes(d.goal)){if(p.goals.length===1){toast('Keep at least one goal for each player.');return;}p.goals=p.goals.filter(g=>g!==d.goal);}else p.goals.push(d.goal);render();}break;case'theme':state.theme=d.theme;render();toast('Visual style changed. Player goals and completed turns are unchanged.');break;case'mode':{const oldMode=state.mode;state.mode=d.mode;if(locked()&&missingGoals().length){state.mode=oldMode;toast('This deck needs cards for every selected goal in that format. Keep this format or reset the sample.');break;}state.revealed=false;state.answer=null;render();}break;case'avatar':avatarModal(d.player);break;case'set-avatar':{const p=state.players.find(p=>p.id===d.player);if(p)p.avatar=d.avatar;closeModal();render();toast(`${p.name}’s avatar changed. Goals and turns are unchanged.`);}break;case'start':startSession();break;case'reveal':if(currentCard()){state.revealed=true;render();}break;case'answer':state.answer=Number(d.answer);render();break;case'complete':completeTurn();break;case'skip':if(locked()&&currentCard()){state.per[player().id].cursor++;state.revealed=false;state.answer=null;render();toast('Card skipped. No turn or clinical result recorded.');}break;case'end':openModal('End this demo session?',`<p class="modal-copy">See the turns completed so far. No results are uploaded or stored.</p><div class="modal-actions"><button class="button" data-action="close">Keep playing</button><button class="button primary" data-action="confirm-end">View recap</button></div>`);break;case'confirm-end':closeModal();state.finished=true;state.view='play';render();break;case'restart':state.started=false;state.finished=false;state.history=[];state.per={};state.current=0;state.view='setup';render();break;case'reset':openModal('Reset the preview?',`<p class="modal-copy">This clears sample session progress and any custom demo decks in this tab. No server data exists to delete.</p><div class="modal-actions"><button class="button" data-action="close">Keep preview</button><button class="button primary" data-action="confirm-reset">Reset everything</button></div>`);break;case'confirm-reset':closeModal();state=makeInitial();render();toast('The preview is back to its original sample data.');break;case'new-deck':formModal('deck');break;case'add-card':formModal('card',d.deck);break;case'use-deck':if(locked())break;clearFinished();{const x=state.decks.find(x=>x.id===d.deck);if(!x?.cards.length)return;state.deckId=x.id;state.view='setup';render();toast('Deck selected. Match each player’s goals to the cards available.');}break;case'view-deck':{const x=state.decks.find(x=>x.id===d.deck);if(!x)return;openModal(x.name,`<p class="modal-copy">${x.cards.length} sample cards. Goal labels are illustrative; content is not clinically validated.</p><div class="card-list">${x.cards.map(c=>`<div class="card-list-item"><strong>${esc(c.emoji||'✦')} ${esc(c.title)}</strong>${esc(c.prompt)}<small>${goalName(c.goal)} · ${c.choices?.length?'Flashcard + multiple choice':'Flashcard only'}</small></div>`).join('')||'<p class="helper">No cards yet. Add a sample card to begin.</p>'}</div><div class="modal-actions"><button class="button primary" data-action="close">Done</button></div>`);}break;case'tour':openModal('A quick way to try the concept',`<ol class="tour-list"><li>Keep the two sample players or choose up to four.</li><li>Select more than one goal for a player.</li><li>Start a session, reveal a cue, and complete a turn.</li><li>Swap an avatar. Notice that goals and completed turns stay attached to the same player.</li><li>Try the older visual style and multiple-choice format.</li><li>Open Deck studio to create a fictional deck and add your own sample cards.</li></ol><p class="modal-copy">This is one turn-based engine on a shared device—not remote multiplayer or a clinical system.</p><div class="modal-actions"><button class="button primary" data-action="close">Explore the preview</button></div>`);break;case'close':closeModal();break;}}
document.addEventListener('click',onAction);
document.addEventListener('change',e=>{if(e.target.id==='deck-select'&&!locked()){clearFinished();state.deckId=e.target.value;render();}if(e.target.id==='turn-select'&&!locked()){clearFinished();state.turns=Number(e.target.value);render();}if(e.target.id==='card-kind'){const both=e.target.value==='both';document.getElementById('choice-fields').hidden=!both;[0,1,2].forEach(i=>document.getElementById('choice-'+i).required=both);}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,fd=new FormData(f);if(f.id==='new-deck-form'){const name=String(fd.get('name')||'').trim();if(!name)return;const id='custom'+(++state.deckCounter);state.decks.push({id,name:name.slice(0,50),description:'Your fictional sample content. Stored in this tab only.',kind:'Custom demo',cards:[]});closeModal();render();toast('Demo deck created. Add a card, then select it in session setup.');}if(f.id==='add-card-form'){const x=state.decks.find(d=>d.id===f.dataset.deck);if(!x||locked()&&x.id===state.deckId)return;const title=String(fd.get('title')||'').trim(),prompt=String(fd.get('prompt')||'').trim(),cue=String(fd.get('cue')||'').trim();const choices=fd.get('kind')==='both'?[0,1,2].map(i=>String(fd.get('choice'+i)||'').trim()):[];if(!title||!prompt||!cue||choices.some(x=>!x)){document.getElementById('form-error').textContent='Complete the required fields with sample content.';return;}if(choices.length&&new Set(choices.map(x=>x.toLowerCase())).size!==3){document.getElementById('form-error').textContent='Use three different answer options.';return;}x.cards.push({id:'custom-card'+(++state.cardCounter),title:title.slice(0,50),prompt:prompt.slice(0,180),cue:cue.slice(0,180),question:prompt.slice(0,180),goal:String(fd.get('goal')),emoji:'✦',choices:choices.map(s=>s.slice(0,70)),correct:Number(fd.get('correct')||0)});closeModal();render();toast('Sample card added. It is available only in this browser tab.');}});
render();
</script>
